[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dam-recommender"
version = "0.1.0"
description = "Recommender-system technical review and Top-N experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6",
  "requests>=2.31",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4", "kagglehub>=1.0.2"]
demo = ["streamlit>=1.36"]
analysis = ["matplotlib>=3.8,<4"]

[project.scripts]
dam-prepare = "src.prepare:main"
dam-train = "src.train:main"
dam-tune = "src.tune:main"

[tool.pytest.ini_options]
testpaths = ["tests", "content_collab/movielens_dataset"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
