[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dam-recommender"
version = "0.1.0"
description = "Reproducible model-based Top-N recommendation experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6",
  "torch>=2.1,<2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["streamlit>=1.36"]

[project.scripts]
dam-prepare = "src.prepare:main"
dam-train = "src.train:main"
dam-tune = "src.tune:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
