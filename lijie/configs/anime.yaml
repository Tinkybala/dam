# Report settings. Choose a model and seed with the training command.
defaults:
  seed: 42
  device: cuda
  gpu_sampling: true
  eval_batch_size: 65536
  early_stopping_patience: 5
  evaluate_test: true
  artifacts_dir: ../artifacts/anime-r7
  output_dir: ../results/anime/{model}-seed-{seed}
models:
  bpr_ensemble:
    model: bpr
    embedding_dim: 128
    learning_rate: 0.00075
    l2: 0.0
    batch_size: 4096
    negatives_per_positive: 24
    epochs: 30
  bpr:
    model: bpr
    embedding_dim: 64
    learning_rate: 0.001
    l2: 0.0
    batch_size: 4096
    negatives_per_positive: 8
    epochs: 30
  gmf:
    model: gmf
    positive_threshold: 7
    maximum_rating: 10
    embedding_dim: 16
    learning_rate: 0.001
    l2: 1.0e-06
    positive_batch_size: 2048
    negatives_per_positive: 8
    epochs: 20
  mlp:
    model: mlp
    positive_threshold: 7
    maximum_rating: 10
    embedding_dim: 64
    hidden_layers:
    - 128
    - 64
    - 32
    dropout: 0.0
    learning_rate: 0.001
    l2: 1.0e-05
    positive_batch_size: 2048
    negatives_per_positive: 8
    epochs: 20
  neumf:
    model: neumf
    positive_threshold: 7
    maximum_rating: 10
    embedding_dim: 32
    hidden_layers:
    - 64
    - 32
    - 16
    - 8
    dropout: 0.0
    learning_rate: 0.001
    l2: 0.0
    positive_batch_size: 2048
    negatives_per_positive: 8
    epochs: 30
  popular:
    model: popular
  weighted_neumf:
    model: weighted_neumf
    positive_threshold: 7
    maximum_rating: 10
    confidence_alpha: 0.5
    embedding_dim: 64
    hidden_layers:
    - 64
    - 32
    - 16
    - 8
    dropout: 0.0
    learning_rate: 0.002
    l2: 0.0
    positive_batch_size: 2048
    negatives_per_positive: 24
    epochs: 30
