name: anime-oneshot-phase-d-alpha
output_root: ../../results/tuning/anime-oneshot-phase-d-alpha
gpus: [0, 1]
require_equal_trial_count: true
base_configs:
  - path: ../selected/anime_neumf_stage_e.yaml
    grid:
      confidence_alpha: [0.0, 0.5, 1.0, 1.5, 2.0]
      early_stopping_patience: [5]
      embedding_dim: [64]
      epochs: [30]
      learning_rate: [0.002]
      model: [weighted_neumf]
      negatives_per_positive: [24]
      positive_batch_size: [2048]
